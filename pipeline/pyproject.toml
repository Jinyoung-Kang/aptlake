[project]
name = "aptlake-pipeline"
version = "0.1.0"
description = "AptLake 수집·정합·품질·발행 파이프라인 (Dagster + Iceberg + Trino + dbt)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.11",
    "dagster-webserver>=1.11",
    "dagster-postgres>=0.27",
    "dagster-dbt>=0.27",
    "dbt-core>=1.10",
    "dbt-trino>=1.9",
    "pyiceberg[pyarrow]>=0.10",
    "trino>=0.335",
    "clickhouse-connect>=0.8",
    "httpx>=0.28",
    "defusedxml>=0.7",
    # 리눅스(컨테이너·CI)는 시스템 libpq 에 대고 빌드한 C 구현 — binary 휠은 AlmaLinux 8 의 오래된 pcre2·지원 끝난
    # OpenSSL 1.1.1 을 묶어 온다 (QA-005). dagster-postgres 의 psycopg2-binary 도 같아 리눅스에서는 소스 빌드 psycopg2 로
    # 바꾼다(아래 override). 맥 개발 환경은 시스템 libpq 가 없어 binary 휠
    "psycopg>=3.2",
    "psycopg-c>=3.2; sys_platform == 'linux'",
    "psycopg-binary>=3.2; sys_platform == 'darwin'",
    "psycopg2>=2.9; sys_platform == 'linux'",
    "redis>=6",
    "boto3>=1.40",
    "numpy>=2.1",
    "scipy>=1.14",
    # SQLAlchemy 2.1 + psycopg3 조합에서 dagster-postgres 의 NOTIFY 가 서버측 바인딩으로 실패 (2026-09 확인) → 2.0 고정
    "sqlalchemy>=2.0,<2.2",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "hypothesis>=6.140",
    "ruff>=0.13",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "testcontainers[clickhouse]>=4.13",
]

[tool.uv]
override-dependencies = ["psycopg2-binary>=2.9; sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aptlake_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the running docker compose lake stack"]
addopts = "-m 'not integration'"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

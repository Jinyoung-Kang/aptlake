version: 2

# 테스트는 Dagster 가 넘긴 월 파티션 범위에서만 돈다 (전체 재검사 비용 회피).
# 범위 상한은 도메인 사실이 아니라 파싱·단위 오류를 잡기 위한 sanity bound 다.
models:
  - name: trade_serving
    description: 현재 거래 (서빙 발행 원본). 해제 포함, 통계에서만 제외.
    config: { meta: { dagster: { group: gold } } }
    data_tests:
      - unique_combination:
          arguments: { columns: [trade_key, dup_seq] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
    columns:
      - name: trade_id
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
          - unique: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
      - name: sgg_cd
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
          - relationships:
              arguments: { to: "source('silver', 'region')", field: sgg_cd }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - name: price_manwon
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
          - value_between:
              arguments: { min_value: 0, max_value: 10000000 }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - name: area_m2
        data_tests:
          - value_between:
              arguments: { min_value: 0, max_value: 1000 }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)", severity: warn }
      - name: deal_kind
        data_tests:
          - accepted_values:
              arguments: { values: ["중개거래", "직거래"] }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)", severity: warn }

  - name: region_month
    description: 시군구 × 계약월 거래량·해제·㎡당 가격 분위수
    data_tests:
      - unique_combination:
          arguments: { columns: [sgg_cd, deal_ym] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "trades + cancelled = reported" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "low_sample or (p25_ppm2 <= median_ppm2 and median_ppm2 <= p75_ppm2)" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
    columns:
      - name: sgg_cd
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
      - name: deal_ym
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }

  - name: region_rollup_month
    description: 시도·전국 × 계약월 통계 (거래 단위에서 다시 계산한 정확 분위수)
    data_tests:
      - unique_combination:
          arguments: { columns: [region_id, deal_ym] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "trades + cancelled = reported" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "low_sample or (p25_ppm2 <= median_ppm2 and median_ppm2 <= p75_ppm2)" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
    columns:
      - name: level
        data_tests:
          - accepted_values:
              arguments: { values: ["nation", "sido"] }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }

  - name: trade_version
    description: 거래 버전 이력 (SCD2)
    data_tests:
      - unique_combination:
          arguments: { columns: [trade_id, version] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }

  # ── 전월세 (ADR-050) — 매매와 같은 방식: 월 파티션 범위에서만, 실패하면 같은 실행의 발행이 막힌다 ──
  - name: rent_serving
    description: 현재 전월세 계약 (서빙 발행 원본). 전세 = 월세 0.
    data_tests:
      - unique_combination:
          arguments: { columns: [rent_key, dup_seq] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "is_jeonse = (monthly_rent_manwon = 0)" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
    columns:
      - name: rent_id
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
          - unique: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
      - name: sgg_cd
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
          - relationships:
              arguments: { to: "source('silver', 'region')", field: sgg_cd }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - name: deposit_manwon
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
          - value_between:
              arguments: { min_value: -1, max_value: 10000000 }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - name: monthly_rent_manwon
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }
          - value_between:
              arguments: { min_value: -1, max_value: 100000 }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - name: area_m2
        data_tests:
          - value_between:
              arguments: { min_value: 0, max_value: 1000 }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)", severity: warn }
      - name: contract_type
        data_tests:
          - accepted_values:
              arguments: { values: ["신규", "갱신"] }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)", severity: warn }
      - name: use_rr_right
        data_tests:
          - accepted_values:
              arguments: { values: ["사용"] }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)", severity: warn }

  - name: rent_version
    description: 전월세 계약 버전 이력 (SCD2)
    data_tests:
      - unique_combination:
          arguments: { columns: [rent_id, version] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }

  - name: region_rent_month
    description: 시군구 × 계약월 전월세 계약 수·전세 보증금 ㎡당 분위수·월세 중앙값
    data_tests:
      - unique_combination:
          arguments: { columns: [sgg_cd, deal_ym] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "jeonse + wolse = contracts" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "renewals + new_contracts <= contracts and rr_used <= contracts and jeonse_priced <= jeonse" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "low_sample or (jeonse_p25_ppm2 <= jeonse_median_ppm2 and jeonse_median_ppm2 <= jeonse_p75_ppm2)" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
    columns:
      - name: sgg_cd
        data_tests:
          - not_null: { config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" } }

  - name: region_rent_rollup_month
    description: 시도·전국 × 계약월 전월세 통계 (계약 단위에서 다시 계산한 정확 분위수)
    data_tests:
      - unique_combination:
          arguments: { columns: [region_id, deal_ym] }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "jeonse + wolse = contracts" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
      - expression_is_true:
          arguments: { expression: "low_sample or (jeonse_p25_ppm2 <= jeonse_median_ppm2 and jeonse_median_ppm2 <= jeonse_p75_ppm2)" }
          config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }
    columns:
      - name: level
        data_tests:
          - accepted_values:
              arguments: { values: ["nation", "sido"] }
              config: { where: "deal_ym = coalesce(nullif('{{ var('deal_ym') }}', ''), deal_ym)" }

  - name: complex_summary
    description: 단지 차원 + 현재 유효 거래 수
    columns:
      - name: complex_key
        data_tests: [unique, not_null]
  - name: source_latency
    description: 원천 반영 지연 분포 (L1 신고·L2 해제, 관측일·시도·제외 사유·지연 일수별 건수, ADR-046)
    data_tests:
      - unique_combination:
          arguments: { columns: [metric, observed_date, sido_cd, reason, lag_days] }
      - expression_is_true:
          arguments: { expression: "(reason = '' and lag_days >= 0) or (reason <> '' and lag_days is null)" }
    columns:
      - name: metric
        data_tests:
          - accepted_values: { arguments: { values: ["L1", "L2"] } }
      - name: reason
        data_tests:
          - accepted_values:
              arguments: { values: ["", "initial_load", "low_resolution", "time_inverted", "no_base_date", "negative_lag"] }
      - name: n
        data_tests: [not_null]


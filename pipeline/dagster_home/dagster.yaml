# Dagster 인스턴스: 실행 이력·이벤트 로그·스케줄 상태를 PostgreSQL(dagster DB)에 저장
storage:
  postgres:
    postgres_db:
      hostname: postgres
      port: 5432
      username: dagster
      password: { env: DAGSTER_PG_PASSWORD }
      db_name: dagster

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# 동시성 풀: 자산마다 pool 을 지정 (rtms · trino_write · publish), 풀마다 동시 1
#   rtms        : 원천 API 호출은 실행 간에도 하나 → 초당 호출 상한 보장
#   trino_write : MERGE·dbt 는 하나씩 → 로컬 메모리 보호, Iceberg 커밋 충돌 회피
#   publish     : ClickHouse 스테이징 테이블 공유
concurrency:
  runs:
    max_concurrent_runs: 1      # 로컬 메모리 보호 (실행 1개 ≈ 0.7~1GB)
  pools:
    default_limit: 1

run_retries:
  enabled: false

telemetry:
  enabled: false

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/home/storage

# 컨테이너 재시작 등으로 프로세스가 사라진 실행을 감지해 FAILURE 로 표시 → 센서가 파티션을 다시 요청
run_monitoring:
  enabled: true
  start_timeout_seconds: 180
  max_resume_run_attempts: 0
  poll_interval_seconds: 60

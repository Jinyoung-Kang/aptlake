# nginx-unprivileged 기본 설정을 바탕으로: 사이트 설정은 기동 시 envsubst 결과(/tmp/aptlake.conf)를 읽는다
# (컨테이너 파일시스템이 읽기 전용이라 tmpfs 에 생성)
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    types { application/geo+json geojson; }
    default_type  application/octet-stream;

    # 접근 로그에는 쿼리 문자열·API 키가 남지 않게 경로만
    log_format  main  '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/problem+json application/geo+json application/javascript text/css image/svg+xml;

    include /tmp/aptlake.conf;
}

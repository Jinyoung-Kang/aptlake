[project]
name = "aptlake-api"
version = "0.1.0"
description = "AptLake 데이터 API — 키 인증·쿼터·계측이 있는 공개형 데이터 API (FastAPI + ClickHouse)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "psycopg[binary,pool]>=3.2",
    "redis>=6",
    "clickhouse-connect[async]>=0.8",
    "prometheus-client>=0.23",
    "boto3>=1.40",
    "pyarrow>=21",
    "orjson>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "testcontainers[postgres,redis,clickhouse]>=4.13",
    "hypothesis>=6.140",
    "ruff>=0.13",
    "mypy>=1.18",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aptlake_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]
ignore = ["S101", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

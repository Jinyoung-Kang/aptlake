# 집값 레이크하우스 (AptLake) — 로컬 Apple Silicon 스택
#   모든 포트는 127.0.0.1 바인딩. 메모리 상한은 서비스별 mem_limit 으로 명시 (NFR-07).
#   프로필: (기본) 서빙 계층 · lake (Trino·Dagster — 수집·변환 시) · obs (Prometheus·Grafana)
name: aptlake

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # ───────────────────────── 저장·메타 ─────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD}
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=120", "-c", "log_min_duration_statement=500"]
    volumes:
      - pg:/var/lib/postgresql/data
      - ./infra/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports: ["127.0.0.1:5492:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

  minio:
    # MinIO 커뮤니티 이미지 배포가 중단되어, Lakekeeper 공식 예제가 쓰는 유지보수 포크(Silo)를 사용 (S3 + STS AssumeRole)
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT: "false"
    volumes: [minio:/data]
    ports: ["127.0.0.1:9600:9000", "127.0.0.1:9601:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20
    # MinIO 는 GOMEMLIMIT 을 한도의 90% 로 잡는다. Go 런타임 약 440~470MB 라 512m 이면 실행 파일·캐시 자리가 없어
    # 늘 한도 안에서 회수·swap 했다 → 768m: major fault −90%, 메모리 멈춤 −88% (ADR-053)
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

  minio-init:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_INGEST_SECRET: ${MINIO_INGEST_SECRET}
      MINIO_CATALOG_SECRET: ${MINIO_CATALOG_SECRET}
      MINIO_EXPORT_SECRET: ${MINIO_EXPORT_SECRET}
      MINIO_SNAPSHOT_SECRET: ${MINIO_SNAPSHOT_SECRET}
    volumes: ["./infra/minio/init.sh:/init.sh:ro"]
    restart: "no"

  # ───────────────────────── Iceberg REST 카탈로그 ─────────────────────────
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      RUST_LOG: info
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["serve"]
    environment: *lakekeeper-env
    depends_on:
      lakekeeper-migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    # 호스트 포트 없음: 카탈로그 관리 API 는 인증이 없어(로컬 구성) 컨테이너 네트워크 안에서만 연다
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      retries: 20
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

  lakekeeper-init:
    image: curlimages/curl:8.23.0
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_CATALOG_SECRET: ${MINIO_CATALOG_SECRET}
    volumes: ["./infra/lakekeeper/init.sh:/init.sh:ro"]
    depends_on: { lakekeeper: { condition: service_healthy } }
    restart: "no"

  # ───────────────────────── 질의·변환 (lake 프로필) ─────────────────────────
  trino:
    image: trinodb/trino:483
    profiles: ["lake"]
    environment:
      # glibc 메모리 영역(arena)을 스레드마다 만들지 않게 — JVM 힙 밖 메모리(RSS)가 늘어 컨테이너 한도에 닿는 것을 막는다
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ./infra/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./infra/trino/etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./infra/trino/etc/rules.json:/etc/trino/rules.json:ro
      - ./infra/trino/etc/catalog:/etc/trino/catalog:ro
      # 힙 OOM 덤프 자리(ADR-055): 이미지에 있는 trino 소유 홈에 붙인다 — 이미지에 없는 경로에 붙이면 root 소유라 쓸 수 없다
      - trino_heapdump:/home/trino
      - ./infra/trino/start.sh:/usr/lib/trino/bin/aptlake-start.sh:ro
    # 같은 덤프 이름(java_pid1.hprof)을 비운 뒤 이미지의 run-trino 를 exec 한다 (Java 는 PID 1 그대로)
    command: ["bash", "/usr/lib/trino/bin/aptlake-start.sh"]
    depends_on: { lakekeeper-init: { condition: service_completed_successfully } }
    # 호스트 포트 없음: 사용자 이름만으로 접속하는 구성이라 밖에 열지 않는다. 직접 질의는 docker compose exec trino trino
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      retries: 40
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

  # ───────────────────────── 서빙 ─────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PUBLISHER_PASSWORD: ${CLICKHOUSE_PUBLISHER_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
      CLICKHOUSE_USAGE_PASSWORD: ${CLICKHOUSE_USAGE_PASSWORD}
    volumes:
      - ch:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/aptlake.xml:/etc/clickhouse-server/config.d/aptlake.xml:ro
      - ./infra/clickhouse/users.d/aptlake-users.xml:/etc/clickhouse-server/users.d/aptlake-users.xml:ro
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:8640:8123", "127.0.0.1:9640:9000"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 3s
      retries: 30
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

  ch-migrate:
    # 서빙 스키마를 기동 때마다 멱등 적용 (IF NOT EXISTS) — initdb 스크립트는 첫 기동에만 돌기 때문
    image: clickhouse/clickhouse-server:26.8
    # 접속 가능해질 때까지 최대 60초 기다린 뒤 스키마는 한 번만 적용 (스키마 오류는 재시도하지 않고 바로 실패)
    entrypoint:
      - sh
      - -c
      - >-
        ch() { clickhouse-client --host clickhouse --user admin --password "$$CLICKHOUSE_ADMIN_PASSWORD" "$$@"; };
        i=0; until ch -q 'SELECT 1' >/dev/null 2>&1; do i=$$((i + 1)); [ $$i -ge 30 ] && exit 1; sleep 2; done;
        ch --multiquery < /init/01-schema.sql &&
        if [ "$$(ch -q "SELECT partition_key FROM system.tables WHERE database = 'aptlake' AND name = 'region_month'")" = "toYYYYMM(month)" ]; then
          ch --multiquery < /migrate/region_month_yearly.sql && echo ch region_month → yearly partitions;
        fi &&
        if [ "$$(ch -q "SELECT extract(engine_full, 'index_granularity = ([0-9]+)') FROM system.tables WHERE database = 'aptlake' AND name = 'trade_current'")" != 1024 ]; then
          if ch --multiquery < /migrate/trade_current_granularity.sql; then echo ch trade_current → index_granularity 1024;
          else ch --multiquery < /init/01-schema.sql; exit 1; fi;
        fi &&
        if [ "$$(ch -q "SELECT count() FROM system.columns WHERE database = 'aptlake' AND table IN ('rent_current', 'rent_current_staging', 'rent_version', 'rent_version_staging') AND name IN ('pre_deposit_manwon', 'pre_monthly_rent_manwon') AND type = 'Nullable(UInt32)'")" != 0 ]; then
          ch --multiquery < /migrate/rent_signed_pre_amounts.sql && echo ch rent previous amounts → signed;
        fi &&
        if [ "$$(ch -q "SELECT type FROM system.columns WHERE database = 'aptlake' AND table = 'complex' AND name = 'land_leasehold'")" = "UInt8" ]; then
          ch --multiquery < /migrate/complex_land_leasehold_nullable.sql && echo ch complex land_leasehold → nullable;
        fi && echo ch schema up to date
    environment:
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
    volumes: ["./infra/clickhouse/init:/init:ro", "./infra/clickhouse/migrate:/migrate:ro"]
    depends_on: { clickhouse: { condition: service_healthy } }
    restart: "no"

  redis:
    image: redis:7.4-alpine
    # ACL: 기본 사용자 끄고, api(한도·캐시·키 캐시)와 pipeline(호출 예산·데이터셋 버전)에 키 접두사·명령 범위를 나눠 준다
    # 기본 사용자는 off(로그인 불가)인 채 권한만 준다 — AOF 재적재가 EXEC 를 기본 사용자 권한으로 검사해, 없으면 Lua·MULTI 로 쓴 키(budget:*)가 재시작마다 NOPERM 으로 버려졌다
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-ttl
        --user default off "~*" "&*" "+@all"
        --user api on ">$$REDIS_API_PASSWORD" "~al:*" "+@all" "-@admin" "-@dangerous"
        --user pipeline on ">$$REDIS_PIPELINE_PASSWORD" "~budget:*" "~al:ds:*" "+@all" "-@admin" "-@dangerous"
        --user healthcheck on ">$$REDIS_API_PASSWORD" "+ping"
    environment:
      REDIS_API_PASSWORD: ${REDIS_API_PASSWORD}
      REDIS_PIPELINE_PASSWORD: ${REDIS_PIPELINE_PASSWORD}
    volumes: [redis:/data]
    ports: ["127.0.0.1:6439:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user healthcheck --pass \"$$REDIS_API_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      retries: 20
    mem_limit: 192m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

  db-migrate:
    build: { context: ./api }
    image: aptlake-api:local
    command: ["sh", "-c", "python -m aptlake_api.migrate && python -m aptlake_api.provision"]
    environment:
      MIGRATOR_DSN: postgresql://migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/aptlake
      WEB_API_KEY: ${WEB_API_KEY:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    image: aptlake-api:local
    build: { context: ./api }
    # 공개 API. 관리 라우트는 이 프로세스에 아예 등록되지 않는다 (api-internal 참고)
    # 워커 4개 (지표는 multiprocess 로 합산). 한도·캐시·키 상태는 모두 Redis 에 있어 워커·인스턴스를 늘려도 정확하다
    command: ["sh", "-c", "mkdir -p /tmp/prom && exec uvicorn aptlake_api.main:create_public_app --factory --host 0.0.0.0 --port 8610 --workers 4 --no-server-header --no-proxy-headers --log-level warning"]
    environment: &api-env
      PG_DSN: postgresql://api_app:${API_DB_PASSWORD}@postgres:5432/aptlake
      REDIS_URL: redis://api:${REDIS_API_PASSWORD}@redis:6379/0
      CH_HOST: clickhouse
      CH_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
      CH_USAGE_PASSWORD: ${CLICKHOUSE_USAGE_PASSWORD}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9600
      S3_EXPORT_ACCESS_KEY: export
      S3_EXPORT_SECRET_KEY: ${MINIO_EXPORT_SECRET}
      # X-Forwarded-For 는 웹(nginx) 컨테이너 고정 IP 에서 온 요청에서만 믿는다
      TRUSTED_PROXIES: 172.30.61.250/32
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
      # 수집 상태 화면의 '오늘 호출 상한' 표시 — 파이프라인과 같은 값
      RTMS_BUDGET_PCT: ${RTMS_BUDGET_PCT:-80}
      RENT_BUDGET_PCT: ${RENT_BUDGET_PCT:-80}
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      ch-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8610:8610"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8610/healthz',timeout=2)"]
      interval: 5s
      retries: 20
    mem_limit: 768m
    pids_limit: 256  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    logging: *logging

  api-internal:
    image: aptlake-api:local
    # 관리 API(/v1/admin) + 내보내기 작업자 + 운영 지표. 호스트 127.0.0.1:8611 에만 게시
    command: ["sh", "-c", "mkdir -p /tmp/prom && exec uvicorn aptlake_api.main:create_internal_app --factory --host 0.0.0.0 --port 8611 --no-server-header --no-proxy-headers --log-level warning"]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:8611:8611"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8611/healthz',timeout=2)"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    pids_limit: 128  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    logging: *logging

  web:
    build: { context: ./web }
    image: aptlake-web:local
    environment:
      WEB_API_KEY: ${WEB_API_KEY:-}
    depends_on: { api: { condition: service_healthy } }
    ports: ["127.0.0.1:3610:8080"]
    networks:
      default: { ipv4_address: 172.30.61.250 }
    mem_limit: 64m
    pids_limit: 64  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    cap_drop: [ALL]  # nginx-unprivileged: 8080 포트·uid 101 이라 필요한 권한 없음
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  # ───────────────────────── 오케스트레이션 (lake 프로필) ─────────────────────────
  dagster:
    build: { context: ./pipeline }
    image: aptlake-pipeline:local
    profiles: ["lake"]
    environment:
      DAGSTER_PG_PASSWORD: ${DAGSTER_DB_PASSWORD}
      PG_DSN: postgresql://pipeline:${PIPELINE_DB_PASSWORD}@postgres:5432/aptlake
      REDIS_URL: redis://pipeline:${REDIS_PIPELINE_PASSWORD}@redis:6379/0
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY}
      REB_API_KEY: ${REB_API_KEY}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      VWORLD_DOMAIN: ${VWORLD_DOMAIN:-}
      RTMS_TRADE_URL: ${RTMS_TRADE_URL:-}
      RTMS_DAILY_LIMIT: ${RTMS_DAILY_LIMIT:-10000}
      RTMS_BUDGET_PCT: ${RTMS_BUDGET_PCT:-80}
      RENT_DAILY_LIMIT: ${RENT_DAILY_LIMIT:-10000}
      RENT_BUDGET_PCT: ${RENT_BUDGET_PCT:-80}
      BACKFILL_FROM: ${BACKFILL_FROM:-2021-01}
      CATALOG_URI: http://lakekeeper:8181/catalog
      CATALOG_WAREHOUSE: aptlake
      TRINO_HOST: trino
      S3_ENDPOINT: http://minio:9000
      S3_INGEST_ACCESS_KEY: ingest
      S3_INGEST_SECRET_KEY: ${MINIO_INGEST_SECRET}
      S3_SNAPSHOT_ACCESS_KEY: snapshot
      S3_SNAPSHOT_SECRET_KEY: ${MINIO_SNAPSHOT_SECRET}
      CH_HOST: clickhouse
      CH_PUBLISHER_PASSWORD: ${CLICKHOUSE_PUBLISHER_PASSWORD}
    volumes: [dagster_home:/opt/dagster/home/storage]
    depends_on:
      trino: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
      # 발행 코드가 기대하는 서빙 스키마(이관 포함)를 먼저 맞춘다 — 파이프라인을 API 보다 먼저 재배포해도
      # (make pipeline-redeploy: 실행이 모두 끝난 뒤라 이관하기에도 안전한 때) 새 코드가 옛 표에 발행하지 않게
      ch-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    ports: ["127.0.0.1:3600:3000"]
    # dagster dev 는 웹서버·데몬·코드 서버를 거느린다 — 기본 10초면 정리 전에 SIGKILL(137) 되므로 넉넉히
    stop_grace_period: 60s
    # 상주(웹서버·데몬·코드 서버) ≈ 0.7GB + 실행 워커 0.25GB + 단계 하나(지수 산출 최대 RSS 0.93GB, 256만 행)
    # → 실측 최대 1.8GB, 여유 포함 2.5GB. 입력이 늘면 다시 잰다 (ADR-052)
    mem_limit: 2560m
    pids_limit: 1024  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  # ───────────────────────── 관측 (obs 프로필) ─────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: ["obs"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom:/prometheus
    ports: ["127.0.0.1:9690:9090"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.4.13
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # 바깥(grafana.com·gravatar)으로 HTTPS 를 내보내지 않는다 — 업데이트·플러그인 확인, 프로필 사진, 서명 공개키 받기,
      # 플러그인 사전 설치·카탈로그, 외부 스냅숏. 수정 전 Go 의 인증서 검증 결함이 닿지 않게 한다 (ADR-040)
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3620:3000"]
    # 실사용(anon)은 약 70MB지만 실행 파일·플러그인 페이지 캐시가 약 190MB — 256MB 에선 캐시를 계속 비우느라 느려진다
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128  # 프로세스·스레드 수 상한 (측정값의 약 4배, JVM·ClickHouse 는 여유)
    restart: unless-stopped
    logging: *logging

networks:
  default:
    ipam:
      # 동적 할당은 아래쪽 절반(.0~.127)만 → 웹 프록시 고정 IP(.250)와 충돌하지 않음
      config: [{ subnet: 172.30.61.0/24, ip_range: 172.30.61.0/25 }]

volumes:
  pg: {}
  minio: {}
  ch: {}
  redis: {}
  dagster_home: {}
  trino_heapdump: {}
  prom: {}
  grafana: {}

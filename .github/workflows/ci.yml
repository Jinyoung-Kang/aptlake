name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소 (러너 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 액션은 태그가 아니라 커밋 SHA 로 고정한다 — 태그는 액션 저장소 쪽에서 옮길 수 있다 (공급망 공격 방지).
# 버전 주석은 Dependabot 이 SHA 와 함께 갱신한다.

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: 시스템 libpq (psycopg C 구현·psycopg2 를 시스템 libpq 에 대고 소스 빌드 — QA-005)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev
      - run: uv sync --frozen
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run mypy src
      - name: dbt parse (문법·참조 검사, DB 연결 없음 — 센서 테스트가 manifest 를 쓴다)
        run: cd dbt && uv run dbt parse --profiles-dir .
      - run: uv run pytest -q
      - name: pip-audit
        run: uv export --frozen --no-dev --no-hashes -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: 시스템 libpq (psycopg C 구현·psycopg2 를 시스템 libpq 에 대고 소스 빌드 — QA-005)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libpq-dev
      - run: uv sync --frozen
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run mypy src
      - name: pytest (Testcontainers — PostgreSQL · Redis · ClickHouse)
        run: uv run pytest -q
      - name: pip-audit
        run: uv export --frozen --no-dev --no-hashes -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b && npx tsc -p tsconfig.test.json
      - name: vitest (순수 함수·API 클라이언트·화면 특성 — 서버 골든 응답 사용)
        run: npm test
      - run: npx vite build
      - run: npm audit --omit=dev --audit-level=high

  # 이미지가 실제로 빌드되는지 (Dependabot 의 베이스 이미지 올림, dbt parse 가 도는 파이프라인 이미지 포함)
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { context: [api, pipeline, web] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build (${{ matrix.context }}) — 기반 이미지는 매번 새로 받는다
        run: docker build --pull -t aptlake-${{ matrix.context }}:ci ${{ matrix.context }}
      # 소스 트리 검사(security 작업)는 이미지 안의 OS 패키지·휠에 묶여 온 라이브러리를 보지 못한다 (QA-005)
      - name: 이미지 취약점 (HIGH·CRITICAL 중 수정판이 있는 것이 하나라도 있으면 실패)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: image, image-ref: "aptlake-${{ matrix.context }}:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (비밀 스캔, al_live_ API 키 규칙 포함)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact
      - name: trivy (의존성·설정 취약점)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - name: compose 설정 검증
        run: cp .env.example .env && python3 tools/init_env.py && sed -i 's/^DATA_GO_KR_KEY=$/DATA_GO_KR_KEY=x/; s/^REB_API_KEY=$/REB_API_KEY=x/' .env && docker compose --profile lake --profile obs config -q

version: 2
# 작은 갱신(minor·patch)은 생태계별로 한 PR 에 묶는다 — PR 이 쏟아지면 검토가 안 된다.
updates:
  - package-ecosystem: uv
    directory: /pipeline
    schedule: { interval: weekly }
    groups: { minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: weekly }
    groups: { minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { minor-patch: { update-types: [minor, patch] } }
  # 베이스 이미지: 파이썬 마이너 버전 올림(3.12 → 3.14)은 의존성 호환 확인이 필요해 자동 제안하지 않는다 (패치만)
  - package-ecosystem: docker
    directories: [/api, /pipeline]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
  # docker-compose.yml 의 서비스 이미지(PostgreSQL·Redis·ClickHouse·Trino 등)
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    groups: { images: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }

# 단일 노드 (코디네이터 = 워커). 메모리 상한은 NFR-07 에 따라 명시한다.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static
query.max-memory=600MB
query.max-memory-per-node=600MB
memory.heap-headroom-per-node=250MB
query.max-execution-time=30m
# 사용자별 권한 (파일 기반 접근 제어)
access-control.config-files=/etc/trino/access-control.properties

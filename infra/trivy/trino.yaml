# trinodb/trino:483 (최신 릴리스) 의 남은 HIGH·CRITICAL 예외 (QA-005) — tools/scan_images.sh third-party 가 읽는다.
# 새 태그로 올리면 다시 스캔해 사라진 항목은 지우고, 만료일이 지나면 다시 판단한다 (지나면 점검이 실패한다).
#
# Trino 는 호스트 포트가 없고 도커 내부망에서 파이프라인(신뢰 클라이언트)과 docker exec 로만 닿는다. TLS 를 켜지 않았고,
# 카탈로그는 Iceberg REST 하나라 ranger·delta-lake·clickhouse·cassandra 플러그인은 카탈로그로 만들지 않는다.

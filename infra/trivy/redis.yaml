# redis:7.4-alpine 의 남은 HIGH·CRITICAL 예외 (QA-005) — tools/scan_images.sh third-party 가 읽는다.
# 새 태그로 올리면 다시 스캔해 사라진 항목은 지우고, 만료일이 지나면 다시 판단한다 (지나면 점검이 실패한다).
#
# OpenSSL 의 QUIC 흐름 제어·DTLS 재전송 결함이다. 이 Redis 는 TLS 를 켜지 않았고(tls-port 없음) QUIC·DTLS 는 쓰지 않는다.
# Alpine 에 수정판(3.3.7-r2)이 있어 공식 이미지가 다시 빌드되면 사라진다.
vulnerabilities:
  - id: CVE-2026-75804
    expired_at: 2026-12-31
    statement: QUIC 미사용 (Redis 는 TLS 도 꺼져 있음)
  - id: CVE-2026-84782
    expired_at: 2026-12-31
    statement: DTLS 미사용 (Redis 는 TLS 도 꺼져 있음)

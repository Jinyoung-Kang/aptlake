# grafana/grafana:12.4.13 의 남은 HIGH·CRITICAL 예외 (QA-005) — tools/scan_images.sh third-party 가 읽는다.
# 새 태그로 올리면 다시 스캔해 사라진 항목은 지우고, 만료일이 지나면 다시 판단한다 (지나면 점검이 실패한다).
#
# Grafana 에 묶인 Tempo 라이브러리의 결함이다. Tempo 데이터 소스를 두지 않는다(프로비저닝은 Prometheus 하나, infra/grafana).
#
# 2026-10 kin-openapi 3건 — 모두 서비스 거부이고, HTTP 요청을 OpenAPI 스키마로 검증할 때(openapi3filter·Schema.VisitJSON) 생긴다.
# 이 바이너리에는 openapi3filter 가 링크되지 않았고(strings 확인), kin-openapi 는 grafana-app-sdk 가 내장 앱 매니페스트의 스키마를
# 변환할 때와 plugin-sdk 의 e2e 저장소에만 쓰인다 — 12.4 의 Grafana 코드에는 요청 본문을 VisitJSON 으로 검증하는 곳이 없다.
# 12.4 최신(12.4.13)에도 남아(2026-10-20 레지스트리 확인) 짧은 만료일로 두고 새 태그가 나오면 올린다.

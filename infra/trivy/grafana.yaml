# grafana/grafana:12.4.12 의 남은 HIGH·CRITICAL 예외 (QA-005) — tools/scan_images.sh third-party 가 읽는다.
# 새 태그로 올리면 다시 스캔해 사라진 항목은 지우고, 만료일이 지나면 다시 판단한다 (지나면 점검이 실패한다).
#
# Grafana 에 묶인 Tempo 라이브러리의 결함이다. Tempo 데이터 소스를 두지 않는다(프로비저닝은 Prometheus 하나, infra/grafana).
#
# 2026-10 Go 표준 라이브러리(net/http Range·HTTP/2 SETTINGS, crypto/tls ECH) 3건 — 모두 서비스 거부다. 아래 이유로 닿지 않지만,
# 수정된 Go(1.26.9·1.27.2)로 빌드한 태그가 아직 없어(2026-10-10 레지스트리 확인) 짧은 만료일로 두고 새 태그가 나오면 올린다.
vulnerabilities:
  - id: CVE-2026-21728
    paths: ["usr/share/grafana/bin/grafana"]
    expired_at: 2026-12-31
    statement: Tempo 데이터 소스 없음 (Tempo 질의 경로 미사용)
  - id: CVE-2026-28377
    paths: ["usr/share/grafana/bin/grafana"]
    expired_at: 2026-12-31
    statement: Tempo 서버·S3 SSE-C 미사용
  - id: CVE-2026-78667
    paths: ["usr/share/grafana/bin/grafana", "usr/share/grafana/bin/grafana-server", "usr/share/grafana/bin/grafana-cli"]
    expired_at: 2026-11-30
    statement: TLS 없이 127.0.0.1(호스트)·내부망에서만 열린다 — 신뢰 클라이언트만 닿는 서비스 거부, grafana-cli 는 실행하지 않는다
